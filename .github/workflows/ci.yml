name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LoupixDeck.Plugin.MediaSession.csproj
      - run: dotnet restore tests/MediaSessionSmoke/MediaSessionSmoke.csproj
      - run: dotnet build LoupixDeck.Plugin.MediaSession.csproj -c Release --no-restore
      - run: dotnet run --project tests/MediaSessionSmoke/MediaSessionSmoke.csproj -c Release --no-restore
